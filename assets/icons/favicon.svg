<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 비스듬한 폴라로이드 사진 프레임 -->
  <g transform="rotate(-5 50 50)">
    <!-- 사진 흰색 틀 -->
    <rect x="18" y="16" width="64" height="72" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    
    <!-- 사진 내부 연핑크 배경 -->
    <rect x="24" y="22" width="52" height="48" rx="3" fill="#FFF0F5"/>
    
    <!-- 사진 위 노란 마스킹 테이프 -->
    <rect x="34" y="8" width="32" height="14" rx="2" fill="#FFE082" opacity="0.9"/>
    
    <!-- 폴라로이드 속 하트 발바닥 -->
    <path d="M50 44 C42 34 32 42 36 53 C40 61 50 68 50 68 C50 68 60 61 64 53 C68 42 58 34 50 44 Z" fill="#FF6584"/>
    <!-- 미니 발가락 점들 -->
    <circle cx="36" cy="33" r="4.5" fill="#FF6584"/>
    <circle cx="45" cy="28" r="4.5" fill="#FF6584"/>
    <circle cx="55" cy="28" r="4.5" fill="#FF6584"/>
    <circle cx="64" cy="33" r="4.5" fill="#FF6584"/>
  </g>
</svg>
